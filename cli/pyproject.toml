[project]
name = "high-destination"
version = "0.1.0"
description = "CLI for the High Destination wallpaper generator"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.scripts]
hd = "hd.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hd"]
